[pytest]
# The repo root must be importable so tests can `import pipeline`. Without this
# pytest only puts tests/ on sys.path (there is no tests/__init__.py) and
# collection fails with ModuleNotFoundError. The local devsync shim sets
# PYTHONPATH itself, which masked the gap until CI ran without it.
pythonpath = .
testpaths = tests
markers =
    slow: full-season builds (minutes, not seconds)
addopts = -q --strict-markers
