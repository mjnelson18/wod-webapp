name: Deploy trigger worker

# Ships /trigger's Cloudflare Worker whenever its files change on main.
# wrangler cannot run on the dev machine (endpoint security blocks npx
# executables outright), so CI is how worker.js edits deploy; the dashboard
# paste on 2026-11-03 was only the bootstrap. The repo is the source of
# truth: a deploy overwrites any dashboard-side code edits, and syncs the
# cron trigger and workers.dev setting from wrangler.toml. The GITHUB_TOKEN
# worker secret is managed in the Cloudflare dashboard and survives deploys.
#
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  dash.cloudflare.com → Workers & Pages → right rail
# Until they exist the job warns and exits green, and the deployed worker
# simply stays as it is — same pattern as reschedule.yml's WORKFLOW_PAT.

on:
  push:
    branches: [main]
    paths:
      - 'trigger/**'
      - '.github/workflows/deploy-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trigger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Cloudflare secrets exist
        id: secrets
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "present=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::warning title=Worker not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy /trigger from CI. The currently deployed worker is unchanged."
          fi

      - name: Deploy with wrangler
        if: steps.secrets.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: trigger
