name: Update data pack

# Rebuilds the JSON artifacts and force-deploys site + data to GitHub Pages.
#
# Two sites come out of this one run: What's On Draft at the root, and Dunelmliga
# — a separate league for a different group — under /dunelmliga/. They share the
# pipeline, the app and this schedule; they share no data. See
# pipeline/config/sites.py.
#
# Nothing is ever committed: Pages is deployed from an artifact, so `main`'s
# history stays free of data commits.
#
# The cron fires more often than we build. pipeline.schedule decides whether a run
# is worth doing, so a quiet run costs ~20 seconds and two small HTTP requests.
# See the README for the schedule and throttling rules.

on:
  schedule:
    # Times are UTC. Premier League kick-offs run ~11:00-23:00 UTC at weekends
    # and ~18:00-23:00 UTC midweek, allowing for BST.
    - cron: '*/10 11-22 * * 0,6'   # weekend match windows
    - cron: '*/10 18-22 * * 1-5'   # weekday evening match windows
    - cron: '17 * * * *'           # hourly otherwise, for bonus/waivers/trades
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pipeline/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if the throttle says no'
        type: boolean
        default: false
      rebuild_archives:
        description: 'Rebuild the frozen 2425/2526 archives'
        type: boolean
        default: false

# Pages needs these; nothing here needs write access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Don't cancel in progress — a half-finished
# deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Bump when onboarding a new season (see README). Both sites publish the same
  # FPL season, so one value covers them.
  CURRENT_SEASON: '2627'
  # WOD only — Dunelmliga has no archived seasons.
  ARCHIVE_SEASONS: '2425 2526'
  # Bump to force archives to rebuild without touching their inputs.
  ARCHIVE_CACHE_VERSION: 'v1'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.digest.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # Raw responses for finalised gameweeks, plus the last-build timestamp the
      # throttle reads. Without this the pipeline refetches all 38 gameweeks every
      # run, which is the exact waste the refactor set out to remove.
      - name: Restore raw response cache
        uses: actions/cache@v6
        with:
          path: pipeline/cache
          key: raw-${{ env.CURRENT_SEASON }}-${{ github.run_id }}
          restore-keys: |
            raw-${{ env.CURRENT_SEASON }}-

      # Runs before the dependency install: the gate is stdlib-only, so a quiet
      # run costs ~15s and two small requests instead of installing pandas.
      - name: Decide whether to build
        id: gate
        run: |
          python -m pipeline.schedule --season "$CURRENT_SEASON" \
            ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}

      - name: Nothing to do
        if: steps.gate.outputs.should_build != 'true'
        run: echo "::notice title=Skipped::${{ steps.gate.outputs.reason }}"

      # Both sites publish the same FPL season and follow the same fixtures, so
      # the expensive question — is a build worth doing at all? — is asked once
      # above. This only asks the cheap one: does Dunelmliga have its league code
      # yet? No network, so it costs nothing on a quiet run.
      - name: Is Dunelmliga configured?
        id: gate-dunelmliga
        if: steps.gate.outputs.should_build == 'true'
        run: |
          python -m pipeline.schedule --season "$CURRENT_SEASON" \
            --site dunelmliga --configured-only

      - name: Install Python dependencies
        if: steps.gate.outputs.should_build == 'true'
        run: pip install --quiet -r requirements.txt

      # Archives are frozen — generated once from committed inputs and reused.
      # 2526 takes ~2 minutes (456 squad-weeks of optimal_points), so it must not
      # run every 10 minutes.
      - name: Restore archive cache
        if: steps.gate.outputs.should_build == 'true'
        id: archive-cache
        uses: actions/cache@v6
        with:
          path: |
            data/wod/2425
            data/wod/2526
            data/wod/seasons.json
          key: >-
            archives-${{ env.ARCHIVE_CACHE_VERSION }}-${{
              hashFiles('pipeline/**/*.py', 'reference/historical/*.csv') }}

      - name: Build frozen archives
        if: >-
          steps.gate.outputs.should_build == 'true' &&
          (steps.archive-cache.outputs.cache-hit != 'true' || inputs.rebuild_archives)
        run: |
          for season in $ARCHIVE_SEASONS; do
            echo "::group::archive $season"
            python -m pipeline.build --season "$season"
            echo "::endgroup::"
          done

      # Skipped between the API rolling over and that season's league codes being
      # known. The archives above still build and deploy, so the site stays live
      # through the whole pre-season.
      - name: Build current season
        if: steps.gate.outputs.should_build == 'true' && steps.gate.outputs.season_ready == 'true'
        run: python -m pipeline.build --season "$CURRENT_SEASON"

      - name: Current season not configured yet
        if: steps.gate.outputs.should_build == 'true' && steps.gate.outputs.season_ready != 'true'
        run: |
          echo "::notice title=Archives only::${{ steps.gate.outputs.reason }}"

      # Dunelmliga: one league, one season, no archives to restore or rebuild.
      - name: Build Dunelmliga
        if: >-
          steps.gate.outputs.should_build == 'true' &&
          steps.gate-dunelmliga.outputs.season_ready == 'true'
        run: python -m pipeline.build --season "$CURRENT_SEASON" --site dunelmliga

      # Always regenerate the index, never rely on it surviving. The archive cache
      # stores the season folders only, so on a cache hit with no build running
      # data/<site>/seasons.json would be absent and the site would fail to load
      # with a 404 — which is exactly what happened once. Fails the run if no
      # seasons are present, rather than deploying a blank app.
      - name: Refresh the season index
        if: steps.gate.outputs.should_build == 'true'
        run: |
          python -m pipeline.outputs --index
          if [ -d data/dunelmliga ]; then
            python -m pipeline.outputs --index --site dunelmliga
          fi

      # Deploy only when the output differs from what is actually live.
      #
      # The comparison is against the digest published *with the site*, not a
      # locally cached one. That makes it self-correcting: if a deploy fails, the
      # old digest stays live and the next run redeploys, instead of recording
      # "deployed" for something that never shipped.
      - name: Compare against the deployed digest
        id: digest
        if: steps.gate.outputs.should_build == 'true'
        run: |
          # The current season's JSON is regenerated every run and is not cached,
          # so a self-correcting skip mid-build (rate limit, or the API going into
          # maintenance after the gate passed) leaves data/<site>/<season> absent.
          # The index is assembled from the folders on disk, so deploying now would
          # publish a site with the current season missing. Keep what is live.
          #
          # Checked per site: both are rebuilt from the same API every run, so
          # either one going missing means this run saw a partial view of it.
          missing=
          if [ "${{ steps.gate.outputs.season_ready }}" = "true" ] \
             && [ ! -d "data/wod/$CURRENT_SEASON" ]; then
            missing="wod"
          fi
          if [ "${{ steps.gate-dunelmliga.outputs.season_ready }}" = "true" ] \
             && [ ! -d "data/dunelmliga/$CURRENT_SEASON" ]; then
            missing="${missing:+$missing }dunelmliga"
          fi
          if [ -n "$missing" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "season_missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Current season missing::$CURRENT_SEASON produced no data" \
                 "for: $missing; keeping the deployed site and retrying on the next run"
            exit 0
          fi

          digest=$(find data -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          live=$(curl -fsSL --max-time 20 "https://${owner}.github.io/${repo}/digest.txt" \
                 || echo unavailable)

          echo "local : $digest"
          echo "live  : $live"
          if [ "$digest" = "$live" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unchanged::output identical to what is deployed; skipping deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.digest.outputs.changed == 'true'
        with:
          # Matches local development, so a build that works here works in CI.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # One app, built once per published site. Each build gets that site's data
      # copied in as web/public/data, so the app itself never knows a site slug —
      # it just reads <base>/data/. Pages serves one site per repo, so Dunelmliga
      # goes into a sub-directory of the WOD build. WOD must therefore build
      # first: its build empties web/dist.
      - name: Build the sites
        if: steps.digest.outputs.changed == 'true'
        run: |
          npm ci --prefix web
          mkdir -p web/public
          # published alongside the site so the next run can tell what is live
          printf '%s' "${{ steps.digest.outputs.digest }}" > web/public/digest.txt

          rm -rf web/public/data
          cp -r data/wod web/public/data
          npm run build --prefix web

          if [ -d data/dunelmliga ]; then
            rm -rf web/public/data
            cp -r data/dunelmliga web/public/data
            npm run build:dunelmliga --prefix web
          else
            echo "::notice title=Dunelmliga skipped::no data built this run"
          fi

      # Resets the throttle timer. Deliberately records only that a *build*
      # happened — whether it deployed is answered by the live digest above.
      # Skipped when the current season produced nothing, so the next run retries
      # immediately instead of waiting out this state's interval.
      - name: Record the build
        if: >-
          steps.gate.outputs.should_build == 'true' &&
          steps.digest.outputs.season_missing != 'true'
        run: |
          python -m pipeline.schedule --season "$CURRENT_SEASON" --record \
            --digest "${{ steps.digest.outputs.digest }}"

      - uses: actions/configure-pages@v6
        if: steps.digest.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.digest.outputs.changed == 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
