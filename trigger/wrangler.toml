# Cloudflare Worker config for the external trigger (see README.md here).
# Deploy from this folder: npx wrangler@latest deploy

name = "wod-trigger"
main = "worker.js"
compatibility_date = "2026-10-01"

# The worker serves one HTTP route, POST /ask (the Explorer's natural-language
# query box), so the workers.dev URL is on. Everything else 404s.
workers_dev = true

[triggers]
# One tick every 10 minutes; worker.js decides what (if anything) is due.
crons = ["*/10 * * * *"]

[observability]
enabled = true

# Per-IP burst control for /ask: 10 requests per 60 seconds. The "unsafe" table
# name is just Cloudflare's label for the rate-limiting binding (open beta) —
# nothing here is unsafe. If a deploy ever rejects it, the worker degrades
# gracefully: /ask checks for the binding before using it.
[[unsafe.bindings]]
name = "ASK_RATE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Monthly budget counter for /ask. ONE-TIME SETUP (see README): create a KV
# namespace in the dashboard (Storage & Databases → KV → Create → "ask-budget"),
# paste its id below and uncomment. Until then the worker skips the budget
# check — the per-IP rate limit above still applies.
# [[kv_namespaces]]
# binding = "ASK_BUDGET"
# id = "PASTE_KV_NAMESPACE_ID_HERE"
